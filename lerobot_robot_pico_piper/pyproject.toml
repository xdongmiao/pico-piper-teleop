[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_pico_piper"
version = "0.1.0"
description = "LeRobot v0.5.1 robot plugin for Pico VR teleoperated dual Piper arms"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["lerobot==0.5.1"]

[project.urls]
Repository = "https://github.com/xdongmiao/pico-piper-teleop"
Issues = "https://github.com/xdongmiao/pico-piper-teleop/issues"

[project.scripts]
pico-piper-diagnose = "lerobot_robot_pico_piper.diagnostics:main"

[tool.setuptools]
packages = ["lerobot_robot_pico_piper"]

