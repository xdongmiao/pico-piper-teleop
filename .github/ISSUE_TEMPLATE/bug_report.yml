name: Bug report
description: Report a reproducible issue without private device data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and validation
      description: ROS, Python, SDK versions and relevant redacted logs. State whether hardware is connected.
